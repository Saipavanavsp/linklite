upstream linklite {
    # round robin by default. A replica that fails 3 times in 10s is skipped
    # for 10s (passive health check).
    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 16k;
    # the default (1000) makes nginx close busy keep-alive connections often,
    # which shows up as connection resets in load tests
    keepalive_requests 10000;

    # When a TLS proxy (Caddy, see docs/DEPLOY_AWS.md) sits in front of nginx
    # on the docker network, take the client ip from its X-Forwarded-For.
    # Requests from anywhere else keep their real source address.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # overwrite instead of append, so clients can't fake their ip and get a
    # fresh rate limit bucket. The app trusts exactly one proxy hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    # if a replica is down or shutting down, retry the request on the other one
    proxy_next_upstream error timeout http_502 http_503;

    # metrics are only for the host and the docker network, not the internet
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://linklite;
    }

    location / {
        proxy_pass http://linklite;
    }
}
