# HTTPS for a single server: Caddy terminates TLS on 80/443 and forwards to
# nginx, which is no longer published on the host. See docs/DEPLOY_AWS.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
services:
  nginx:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
